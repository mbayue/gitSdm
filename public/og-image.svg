<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-glow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Graph decorative nodes & edges on right side -->
  <g stroke="#3b82f6" stroke-opacity="0.25" stroke-width="2">
    <line x1="720" y1="200" x2="880" y2="160"/>
    <line x1="880" y1="160" x2="1040" y2="240"/>
    <line x1="880" y1="160" x2="840" y2="340"/>
    <line x1="840" y1="340" x2="980" y2="420"/>
    <line x1="720" y1="200" x2="740" y2="380"/>
    <line x1="740" y1="380" x2="840" y2="340"/>
    <line x1="1040" y1="240" x2="980" y2="420"/>
    <line x1="840" y1="340" x2="680" y2="460"/>
  </g>

  <!-- Glow nodes -->
  <circle cx="880" cy="160" r="28" fill="#1e3a8a" fill-opacity="0.5" filter="url(#glow)"/>
  <circle cx="880" cy="160" r="14" fill="#60a5fa"/>
  <circle cx="720" cy="200" r="10" fill="#38bdf8"/>
  <circle cx="1040" cy="240" r="12" fill="#818cf8"/>
  <circle cx="840" cy="340" r="18" fill="#3b82f6"/>
  <circle cx="740" cy="380" r="8" fill="#94a3b8"/>
  <circle cx="980" cy="420" r="11" fill="#a78bfa"/>
  <circle cx="680" cy="460" r="9" fill="#64748b"/>

  <!-- Brand logo mark -->
  <g transform="translate(100, 140)">
    <rect width="80" height="80" rx="20" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <g stroke="#60a5fa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M26 18v30M56 34a22 22 0 0 1-22 22"/>
      <circle cx="56" cy="26" r="7" fill="#1e293b"/>
      <circle cx="26" cy="56" r="7" fill="#1e293b"/>
    </g>
  </g>

  <!-- Typography -->
  <text x="100" y="290" fill="#f8fafc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-0.02em">
    gitSdm
  </text>
  <text x="320" y="260" fill="#60a5fa" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600">
    v3.0
  </text>

  <text x="100" y="350" fill="url(#accent-grad)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="600" letter-spacing="-0.01em">
    Interactive Repository Intelligence
  </text>

  <text x="100" y="405" fill="#94a3b8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">
    Explore files, dependencies, modules, and architecture in your browser.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 465)">
    <rect x="0" y="0" width="180" height="42" rx="21" fill="#1e293b" stroke="#334155"/>
    <text x="90" y="26" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="15" font-weight="500" text-anchor="middle">Interactive Graph</text>

    <rect x="195" y="0" width="180" height="42" rx="21" fill="#1e293b" stroke="#334155"/>
    <text x="285" y="26" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="15" font-weight="500" text-anchor="middle">Mermaid Diagrams</text>

    <rect x="390" y="0" width="160" height="42" rx="21" fill="#1e293b" stroke="#334155"/>
    <text x="470" y="26" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="15" font-weight="500" text-anchor="middle">Semantic Search</text>

    <rect x="565" y="0" width="140" height="42" rx="21" fill="#1e293b" stroke="#334155"/>
    <text x="635" y="26" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="15" font-weight="500" text-anchor="middle">AI Insights</text>
  </g>
</svg>
