# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build

      # Bundle size gate — fail if total gzipped JS exceeds 2.5 MB
      # Current baseline: ~1.87 MB (Mermaid, force-graph, recharts, etc.)
      - name: Check bundle size
        run: |
          total=0
          for f in dist/assets/*.js; do
            size=$(gzip -c "$f" | wc -c)
            total=$((total + size))
          done
          echo "Total gzipped JS: $total bytes"
          if [ "$total" -gt 2500000 ]; then
            echo "❌ Bundle size $total bytes exceeds 2.5 MB limit"
            exit 1
          fi
          echo "✅ Bundle size within limit"

      # Upload visualizer stats if available
      - name: Upload bundle stats
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-stats
          path: dist/stats.html
          retention-days: 7

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: npx playwright install chromium
      - run: AI_PROVIDER=mock bun run build
      - run: AI_PROVIDER=mock bun run build:server
      - run: AI_PROVIDER=mock bun run test:e2e
        env:
          CI: true

  a11y:
    name: Accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: npx playwright install chromium
      - run: AI_PROVIDER=mock bun run build
      - run: AI_PROVIDER=mock bun run build:server
      - run: AI_PROVIDER=mock bun run test:a11y
        env:
          CI: true
