  <meta name="description" content="Interactive dependency visualization for exploring repository files, modules, and architecture." />
  <meta name="theme-color" content="#18181b" />
  <link rel="canonical" href="https://gsdm.site/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="gitSdm" />
  <meta property="og:title" content="gitSdm — Git Software Dependency Map" />
  <meta property="og:description" content="Interactive dependency visualization for exploring repository files, modules, and architecture." />
  <meta property="og:url" content="https://gsdm.site/" />
  <meta property="og:image" content="https://gsdm.site/og-image.png" />

  <meta property="og:image:height" content="630" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="gitSdm — Git Software Dependency Map" />
  <meta name="twitter:description" content="Interactive dependency visualization for exploring repository files, modules, and architecture." />
  <meta name="twitter:image" content="https://gsdm.site/og-image.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script>
    (function () {
      try {
        var theme = localStorage.getItem('theme');
        try {
          var savedTheme = JSON.parse(localStorage.getItem('gitsdm-viz-storage') || 'null')?.state?.theme;
          if (savedTheme === 'light' || savedTheme === 'dark') theme = savedTheme;
        } catch {
          // Older or invalid persisted state falls back to legacy preference
        }
        if (theme === 'light') {
          document.documentElement.classList.add('light');
          document.documentElement.style.colorScheme = 'light';
        } else {
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (e) {
        // Fallback
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
